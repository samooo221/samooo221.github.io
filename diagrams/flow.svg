<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1118" viewBox="0 0 900 1118" font-family="Inter, Helvetica, Arial, sans-serif">
<title>How one task flows from brief to merge</title>
<defs><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1.5,1.5 L8,5 L1.5,8.5" fill="none" stroke="#8C8C8C" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="ags" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L8,5 L1.5,8.5" fill="none" stroke="#8C8C8C" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1.5,1.5 L8,5 L1.5,8.5" fill="none" stroke="#EDEDED" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="aks" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L8,5 L1.5,8.5" fill="none" stroke="#EDEDED" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1.5,1.5 L8,5 L1.5,8.5" fill="none" stroke="#E5262B" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="ars" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L8,5 L1.5,8.5" fill="none" stroke="#E5262B" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></marker></defs>
<rect width="900" height="1118" fill="#111111"/>
<g transform="translate(0,-132)">
<rect x="116.0" y="160.0" width="500.0" height="122.0" rx="10" fill="none" stroke="#8C8C8C" stroke-width="1.4"/>
<circle cx="84.0" cy="190.0" r="16" fill="#EDEDED" stroke="none" stroke-width="1.4"/>
<text x="84.0" y="196.0" font-size="17" font-weight="700" fill="#111111" text-anchor="middle">1</text>
<text x="136.0" y="194.0" font-size="21" font-weight="700" fill="#EDEDED" text-anchor="start">Brief</text>
<text x="136.0" y="222.0" font-size="16" font-weight="400" fill="#B0B0B0" text-anchor="start">The lead writes the goal and what done means. It names the</text>
<text x="136.0" y="243.0" font-size="16" font-weight="400" fill="#B0B0B0" text-anchor="start">files the worker owns, what to leave alone, the check to run</text>
<text x="136.0" y="264.0" font-size="16" font-weight="400" fill="#B0B0B0" text-anchor="start">and the report path.</text>
<text x="640.0" y="194.0" font-size="14" font-weight="600" fill="#8C8C8C" text-anchor="start">Who</text>
<text x="640.0" y="218.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">Lead</text>
<line x1="366.0" y1="285.0" x2="366.0" y2="323.0" stroke="#EDEDED" stroke-width="1.5" marker-end="url(#ak)"/>
<rect x="116.0" y="326.0" width="500.0" height="122.0" rx="10" fill="none" stroke="#8C8C8C" stroke-width="1.4"/>
<circle cx="84.0" cy="356.0" r="16" fill="#EDEDED" stroke="none" stroke-width="1.4"/>
<text x="84.0" y="362.0" font-size="17" font-weight="700" fill="#111111" text-anchor="middle">2</text>
<text x="136.0" y="360.0" font-size="21" font-weight="700" fill="#EDEDED" text-anchor="start">Worker</text>
<text x="136.0" y="388.0" font-size="16" font-weight="400" fill="#B0B0B0" text-anchor="start">The worker builds on its own files. It logs one line per</text>
<text x="136.0" y="409.0" font-size="16" font-weight="400" fill="#B0B0B0" text-anchor="start">attempt in a diary. Three identical failures force a new</text>
<text x="136.0" y="430.0" font-size="16" font-weight="400" fill="#B0B0B0" text-anchor="start">approach.</text>
<text x="640.0" y="360.0" font-size="14" font-weight="600" fill="#8C8C8C" text-anchor="start">Who</text>
<text x="640.0" y="384.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">Lowest level that can do it</text>
<line x1="366.0" y1="451.0" x2="366.0" y2="489.0" stroke="#EDEDED" stroke-width="1.5" marker-end="url(#ak)"/>
<rect x="116.0" y="492.0" width="500.0" height="122.0" rx="10" fill="none" stroke="#8C8C8C" stroke-width="1.4"/>
<circle cx="84.0" cy="522.0" r="16" fill="#EDEDED" stroke="none" stroke-width="1.4"/>
<text x="84.0" y="528.0" font-size="17" font-weight="700" fill="#111111" text-anchor="middle">3</text>
<text x="136.0" y="526.0" font-size="21" font-weight="700" fill="#EDEDED" text-anchor="start">Report file</text>
<text x="136.0" y="554.0" font-size="16" font-weight="400" fill="#B0B0B0" text-anchor="start">The full report goes to a file. The reply to the lead is 15 lines</text>
<text x="136.0" y="575.0" font-size="16" font-weight="400" fill="#B0B0B0" text-anchor="start">or fewer. A report is data, never approval.</text>
<text x="640.0" y="526.0" font-size="14" font-weight="600" fill="#8C8C8C" text-anchor="start">Who</text>
<text x="640.0" y="550.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">Worker</text>
<line x1="366.0" y1="617.0" x2="366.0" y2="655.0" stroke="#EDEDED" stroke-width="1.5" marker-end="url(#ak)"/>
<rect x="116.0" y="658.0" width="500.0" height="122.0" rx="10" fill="none" stroke="#8C8C8C" stroke-width="1.4"/>
<circle cx="84.0" cy="688.0" r="16" fill="#EDEDED" stroke="none" stroke-width="1.4"/>
<text x="84.0" y="694.0" font-size="17" font-weight="700" fill="#111111" text-anchor="middle">4</text>
<text x="136.0" y="692.0" font-size="21" font-weight="700" fill="#EDEDED" text-anchor="start">Verify and review</text>
<text x="136.0" y="720.0" font-size="16" font-weight="400" fill="#B0B0B0" text-anchor="start">A real check runs and writes a green record for one commit.</text>
<text x="136.0" y="741.0" font-size="16" font-weight="400" fill="#B0B0B0" text-anchor="start">Someone who did not write the code reads the diff and lists</text>
<text x="136.0" y="762.0" font-size="16" font-weight="400" fill="#B0B0B0" text-anchor="start">blockers.</text>
<text x="640.0" y="692.0" font-size="14" font-weight="600" fill="#8C8C8C" text-anchor="start">Who</text>
<text x="640.0" y="716.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">Gate, then a fresh reader</text>
<line x1="366.0" y1="783.0" x2="366.0" y2="821.0" stroke="#EDEDED" stroke-width="1.5" marker-end="url(#ak)"/>
<rect x="116.0" y="824.0" width="500.0" height="122.0" rx="10" fill="none" stroke="#E5262B" stroke-width="1.8"/>
<circle cx="84.0" cy="854.0" r="16" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="84.0" y="860.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="136.0" y="858.0" font-size="21" font-weight="700" fill="#EDEDED" text-anchor="start">Decision</text>
<text x="136.0" y="886.0" font-size="16" font-weight="400" fill="#B0B0B0" text-anchor="start">The lead accepts or rejects. Spending, deploys and pushes</text>
<text x="136.0" y="907.0" font-size="16" font-weight="400" fill="#B0B0B0" text-anchor="start">to main wait for my typed reply.</text>
<text x="640.0" y="858.0" font-size="14" font-weight="600" fill="#8C8C8C" text-anchor="start">Who</text>
<text x="640.0" y="882.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">Lead, then me</text>
<line x1="366.0" y1="949.0" x2="366.0" y2="987.0" stroke="#EDEDED" stroke-width="1.5" marker-end="url(#ak)"/>
<rect x="116.0" y="990.0" width="500.0" height="122.0" rx="10" fill="none" stroke="#8C8C8C" stroke-width="1.4"/>
<circle cx="84.0" cy="1020.0" r="16" fill="#EDEDED" stroke="none" stroke-width="1.4"/>
<text x="84.0" y="1026.0" font-size="17" font-weight="700" fill="#111111" text-anchor="middle">6</text>
<text x="136.0" y="1024.0" font-size="21" font-weight="700" fill="#EDEDED" text-anchor="start">Merge</text>
<text x="136.0" y="1052.0" font-size="16" font-weight="400" fill="#B0B0B0" text-anchor="start">Landing was refused without a matching green record. The</text>
<text x="136.0" y="1073.0" font-size="16" font-weight="400" fill="#B0B0B0" text-anchor="start">merged tree had to equal the verified tree.</text>
<text x="640.0" y="1024.0" font-size="14" font-weight="600" fill="#8C8C8C" text-anchor="start">Who</text>
<text x="640.0" y="1048.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">Landing guard, game</text>
<text x="640.0" y="1070.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">project (closed 3 Oct)</text>
<path d="M 116 754 H 46 V 422 H 113" fill="none" stroke="#E5262B" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<text x="30.0" y="588.0" font-size="15" font-weight="500" fill="#E5262B" text-anchor="middle" transform="rotate(-90 30.0 588.0)">Blocked or failed twice: new brief, one level up</text>
<text x="40.0" y="1200.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="start">Up the ladder: Sonnet, then Opus xhigh. If that fails twice too, the lead does the job itself.</text>
<text x="40.0" y="1226.0" font-size="15" font-weight="500" fill="#8C8C8C" text-anchor="start">Samuel Pavlovič  ·  AI agentic work audit  ·  data to 9 Oct 2026</text>
</g>
</svg>
