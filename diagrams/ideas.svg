<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1343" viewBox="0 0 900 1343" font-family="Inter, Helvetica, Arial, sans-serif">
<title>Verified outstanding ideas by theme</title>
<defs><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1.5,1.5 L8,5 L1.5,8.5" fill="none" stroke="#8C8C8C" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="ags" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L8,5 L1.5,8.5" fill="none" stroke="#8C8C8C" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1.5,1.5 L8,5 L1.5,8.5" fill="none" stroke="#EDEDED" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="aks" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L8,5 L1.5,8.5" fill="none" stroke="#EDEDED" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1.5,1.5 L8,5 L1.5,8.5" fill="none" stroke="#E5262B" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="ars" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L8,5 L1.5,8.5" fill="none" stroke="#E5262B" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></marker></defs>
<rect width="900" height="1343" fill="#111111"/>
<g transform="translate(0,-123)">
<text x="40.0" y="168.0" font-size="21" font-weight="700" fill="#EDEDED" text-anchor="start">Checks that can fail</text>
<text x="860.0" y="168.0" font-size="18" font-weight="600" fill="#8C8C8C" text-anchor="end">6</text>
<line x1="40.0" y1="180.0" x2="860.0" y2="180.0" stroke="#444444" stroke-width="1"/>
<text x="40.0" y="212.0" font-size="15" font-weight="700" fill="#E5262B" text-anchor="start">01</text>
<text x="74.0" y="212.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">A check is not a guard until it fails</text>
<text x="860.0" y="212.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="end">27 Jul</text>
<text x="40.0" y="248.0" font-size="15" font-weight="700" fill="#E5262B" text-anchor="start">02</text>
<text x="74.0" y="248.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">A second stage that tries to refute</text>
<text x="860.0" y="248.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="end">6 Aug</text>
<text x="40.0" y="284.0" font-size="15" font-weight="700" fill="#E5262B" text-anchor="start">03</text>
<text x="74.0" y="284.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">A reviewer from another model family</text>
<text x="860.0" y="284.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="end">7 Aug</text>
<text x="40.0" y="320.0" font-size="15" font-weight="700" fill="#E5262B" text-anchor="start">04</text>
<text x="74.0" y="320.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">Measure the judge before the score</text>
<text x="860.0" y="320.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="end">25 Aug</text>
<text x="40.0" y="356.0" font-size="15" font-weight="700" fill="#E5262B" text-anchor="start">05</text>
<text x="74.0" y="356.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">A green record tied to one commit</text>
<text x="860.0" y="356.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="end">17 Sep / 23 Sep</text>
<text x="40.0" y="392.0" font-size="15" font-weight="700" fill="#E5262B" text-anchor="start">06</text>
<text x="74.0" y="392.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">Rule pages list the wrong builds</text>
<text x="860.0" y="392.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="end">28 Sep</text>
<text x="40.0" y="450.0" font-size="21" font-weight="700" fill="#EDEDED" text-anchor="start">Rules as code</text>
<text x="860.0" y="450.0" font-size="18" font-weight="600" fill="#8C8C8C" text-anchor="end">5</text>
<line x1="40.0" y1="462.0" x2="860.0" y2="462.0" stroke="#444444" stroke-width="1"/>
<text x="40.0" y="494.0" font-size="15" font-weight="700" fill="#E5262B" text-anchor="start">07</text>
<text x="74.0" y="494.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">Guards whose refusal is final</text>
<text x="860.0" y="494.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="end">21 Aug / 2 Oct</text>
<text x="40.0" y="530.0" font-size="15" font-weight="700" fill="#E5262B" text-anchor="start">08</text>
<text x="74.0" y="530.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">A kernel fence, not a polite request</text>
<text x="860.0" y="530.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="end">3 Sep</text>
<text x="40.0" y="566.0" font-size="15" font-weight="700" fill="#E5262B" text-anchor="start">09</text>
<text x="74.0" y="566.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">Teach, but enforce who produces</text>
<text x="860.0" y="566.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="end">13 Sep</text>
<text x="40.0" y="602.0" font-size="15" font-weight="700" fill="#E5262B" text-anchor="start">10</text>
<text x="74.0" y="602.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">Count the incident, fix, dry run first</text>
<text x="860.0" y="602.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="end">23 Sep</text>
<text x="40.0" y="638.0" font-size="15" font-weight="700" fill="#E5262B" text-anchor="start">11</text>
<text x="74.0" y="638.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">Approvals an agent cannot give itself</text>
<text x="860.0" y="638.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="end">25 Sep / 2 Oct</text>
<text x="40.0" y="696.0" font-size="21" font-weight="700" fill="#EDEDED" text-anchor="start">Delegation at scale</text>
<text x="860.0" y="696.0" font-size="18" font-weight="600" fill="#8C8C8C" text-anchor="end">6</text>
<line x1="40.0" y1="708.0" x2="860.0" y2="708.0" stroke="#444444" stroke-width="1"/>
<text x="40.0" y="740.0" font-size="15" font-weight="700" fill="#E5262B" text-anchor="start">12</text>
<text x="74.0" y="740.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">Many workers in measured waves</text>
<text x="860.0" y="740.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="end">3 Jul</text>
<text x="40.0" y="776.0" font-size="15" font-weight="700" fill="#E5262B" text-anchor="start">13</text>
<text x="74.0" y="776.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">Every job a contract with a write scope</text>
<text x="860.0" y="776.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="end">13 Aug</text>
<text x="40.0" y="812.0" font-size="15" font-weight="700" fill="#E5262B" text-anchor="start">14</text>
<text x="74.0" y="812.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">Shrink the job for a small open model</text>
<text x="860.0" y="812.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="end">21 Aug</text>
<text x="40.0" y="848.0" font-size="15" font-weight="700" fill="#E5262B" text-anchor="start">15</text>
<text x="74.0" y="848.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">Codex builds, Claude proves</text>
<text x="860.0" y="848.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="end">27 Sep</text>
<text x="40.0" y="884.0" font-size="15" font-weight="700" fill="#E5262B" text-anchor="start">16</text>
<text x="74.0" y="884.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">A diary, three strikes, thin slice</text>
<text x="860.0" y="884.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="end">30 Sep</text>
<text x="40.0" y="920.0" font-size="15" font-weight="700" fill="#E5262B" text-anchor="start">17</text>
<text x="74.0" y="920.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">A written, priced ladder of workers</text>
<text x="860.0" y="920.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="end">1 Oct</text>
<text x="40.0" y="978.0" font-size="21" font-weight="700" fill="#EDEDED" text-anchor="start">Owner in control</text>
<text x="860.0" y="978.0" font-size="18" font-weight="600" fill="#8C8C8C" text-anchor="end">4</text>
<line x1="40.0" y1="990.0" x2="860.0" y2="990.0" stroke="#444444" stroke-width="1"/>
<text x="40.0" y="1022.0" font-size="15" font-weight="700" fill="#E5262B" text-anchor="start">18</text>
<text x="74.0" y="1022.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">A rulebook that changes only on my words</text>
<text x="860.0" y="1022.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="end">3 Jul / 23 Sep</text>
<text x="40.0" y="1058.0" font-size="15" font-weight="700" fill="#E5262B" text-anchor="start">19</text>
<text x="74.0" y="1058.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">Dictated idea to checked result in hours</text>
<text x="860.0" y="1058.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="end">3 Jul</text>
<text x="40.0" y="1094.0" font-size="15" font-weight="700" fill="#E5262B" text-anchor="start">20</text>
<text x="74.0" y="1094.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">A control panel for a non-coder</text>
<text x="860.0" y="1094.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="end">3 Sep</text>
<text x="40.0" y="1130.0" font-size="15" font-weight="700" fill="#E5262B" text-anchor="start">21</text>
<text x="74.0" y="1130.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">Keep truth, let derived be rebuilt</text>
<text x="860.0" y="1130.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="end">4 Oct</text>
<text x="40.0" y="1188.0" font-size="21" font-weight="700" fill="#EDEDED" text-anchor="start">Measure, cost and honesty</text>
<text x="860.0" y="1188.0" font-size="18" font-weight="600" fill="#8C8C8C" text-anchor="end">4</text>
<line x1="40.0" y1="1200.0" x2="860.0" y2="1200.0" stroke="#444444" stroke-width="1"/>
<text x="40.0" y="1232.0" font-size="15" font-weight="700" fill="#E5262B" text-anchor="start">22</text>
<text x="74.0" y="1232.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">Numbers beside baselines, failures beside wins</text>
<text x="860.0" y="1232.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="end">26 Jun</text>
<text x="40.0" y="1268.0" font-size="15" font-weight="700" fill="#E5262B" text-anchor="start">23</text>
<text x="74.0" y="1268.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">Spend as code: reserve, then stop</text>
<text x="860.0" y="1268.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="end">24 Jul / 11 Sep</text>
<text x="40.0" y="1304.0" font-size="15" font-weight="700" fill="#E5262B" text-anchor="start">24</text>
<text x="74.0" y="1304.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">Test before adding, delete what fails</text>
<text x="860.0" y="1304.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="end">7 Aug</text>
<text x="40.0" y="1340.0" font-size="15" font-weight="700" fill="#E5262B" text-anchor="start">25</text>
<text x="74.0" y="1340.0" font-size="17" font-weight="500" fill="#EDEDED" text-anchor="start">Measure the context policy, cut the rest</text>
<text x="860.0" y="1340.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="end">18 Sep</text>
<text x="40.0" y="1416.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="start">idea was checked against its sources in a private audit.</text>
<text x="40.0" y="1395.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="start">Dates: first seen in git history, logs or notes. Where the idea and its code differ, the date reads idea / code. Each</text>
<text x="40.0" y="1442.0" font-size="15" font-weight="500" fill="#8C8C8C" text-anchor="start">Samuel Pavlovič  ·  AI agentic work audit  ·  data to 9 Oct 2026</text>
</g>
</svg>
