<rect width="900" height="1466" fill="#FFFFFF"/>
<rect x="40.0" y="34.0" width="48.0" height="4.0" rx="0" fill="#E5262B" stroke="none" stroke-width="1.2"/>
<text x="40.0" y="80.0" font-size="32" font-weight="700" fill="#111111" text-anchor="start">Ideas that held up</text>
<text x="40.0" y="112.0" font-size="18" font-weight="400" fill="#666666" text-anchor="start">25 verified ideas in 5 themes, each with the date it first shows in the record.</text>
<text x="40.0" y="168.0" font-size="21" font-weight="700" fill="#111111" text-anchor="start">Checks that can fail</text>
<text x="860.0" y="168.0" font-size="18" font-weight="600" fill="#9A9A9A" text-anchor="end">6</text>
<line x1="40.0" y1="180.0" x2="860.0" y2="180.0" stroke="#D6D6D6" stroke-width="1"/>
<circle cx="52.0" cy="207.0" r="4.5" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="74.0" y="212.0" font-size="17" font-weight="500" fill="#111111" text-anchor="start">A check is not a guard until it fails</text>
<text x="860.0" y="212.0" font-size="15" font-weight="400" fill="#666666" text-anchor="end">27 Jul</text>
<circle cx="52.0" cy="243.0" r="4.5" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="74.0" y="248.0" font-size="17" font-weight="500" fill="#111111" text-anchor="start">A second stage that tries to refute</text>
<text x="860.0" y="248.0" font-size="15" font-weight="400" fill="#666666" text-anchor="end">6 Aug</text>
<circle cx="52.0" cy="279.0" r="4.5" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="74.0" y="284.0" font-size="17" font-weight="500" fill="#111111" text-anchor="start">A reviewer from another model family</text>
<text x="860.0" y="284.0" font-size="15" font-weight="400" fill="#666666" text-anchor="end">7 Aug</text>
<circle cx="52.0" cy="315.0" r="4.5" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="74.0" y="320.0" font-size="17" font-weight="500" fill="#111111" text-anchor="start">Measure the judge before the score</text>
<text x="860.0" y="320.0" font-size="15" font-weight="400" fill="#666666" text-anchor="end">25 Aug</text>
<circle cx="52.0" cy="351.0" r="4.5" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="74.0" y="356.0" font-size="17" font-weight="500" fill="#111111" text-anchor="start">A green record tied to one commit</text>
<text x="860.0" y="356.0" font-size="15" font-weight="400" fill="#666666" text-anchor="end">17 Sep / 23 Sep</text>
<circle cx="52.0" cy="387.0" r="4.5" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="74.0" y="392.0" font-size="17" font-weight="500" fill="#111111" text-anchor="start">Rule pages list the wrong builds</text>
<text x="860.0" y="392.0" font-size="15" font-weight="400" fill="#666666" text-anchor="end">28 Sep</text>
<text x="40.0" y="450.0" font-size="21" font-weight="700" fill="#111111" text-anchor="start">Rules as code</text>
<text x="860.0" y="450.0" font-size="18" font-weight="600" fill="#9A9A9A" text-anchor="end">5</text>
<line x1="40.0" y1="462.0" x2="860.0" y2="462.0" stroke="#D6D6D6" stroke-width="1"/>
<circle cx="52.0" cy="489.0" r="4.5" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="74.0" y="494.0" font-size="17" font-weight="500" fill="#111111" text-anchor="start">Guards whose refusal is final</text>
<text x="860.0" y="494.0" font-size="15" font-weight="400" fill="#666666" text-anchor="end">21 Aug / 2 Oct</text>
<circle cx="52.0" cy="525.0" r="4.5" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="74.0" y="530.0" font-size="17" font-weight="500" fill="#111111" text-anchor="start">A kernel fence, not a polite request</text>
<text x="860.0" y="530.0" font-size="15" font-weight="400" fill="#666666" text-anchor="end">3 Sep</text>
<circle cx="52.0" cy="561.0" r="4.5" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="74.0" y="566.0" font-size="17" font-weight="500" fill="#111111" text-anchor="start">Teach, but enforce who produces</text>
<text x="860.0" y="566.0" font-size="15" font-weight="400" fill="#666666" text-anchor="end">13 Sep</text>
<circle cx="52.0" cy="597.0" r="4.5" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="74.0" y="602.0" font-size="17" font-weight="500" fill="#111111" text-anchor="start">Count the incident, fix, dry run first</text>
<text x="860.0" y="602.0" font-size="15" font-weight="400" fill="#666666" text-anchor="end">23 Sep</text>
<circle cx="52.0" cy="633.0" r="4.5" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="74.0" y="638.0" font-size="17" font-weight="500" fill="#111111" text-anchor="start">Approvals an agent cannot give itself</text>
<text x="860.0" y="638.0" font-size="15" font-weight="400" fill="#666666" text-anchor="end">25 Sep / 2 Oct</text>
<text x="40.0" y="696.0" font-size="21" font-weight="700" fill="#111111" text-anchor="start">Delegation at scale</text>
<text x="860.0" y="696.0" font-size="18" font-weight="600" fill="#9A9A9A" text-anchor="end">6</text>
<line x1="40.0" y1="708.0" x2="860.0" y2="708.0" stroke="#D6D6D6" stroke-width="1"/>
<circle cx="52.0" cy="735.0" r="4.5" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="74.0" y="740.0" font-size="17" font-weight="500" fill="#111111" text-anchor="start">Many workers in measured waves</text>
<text x="860.0" y="740.0" font-size="15" font-weight="400" fill="#666666" text-anchor="end">3 Jul</text>
<circle cx="52.0" cy="771.0" r="4.5" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="74.0" y="776.0" font-size="17" font-weight="500" fill="#111111" text-anchor="start">Every job a contract with a write scope</text>
<text x="860.0" y="776.0" font-size="15" font-weight="400" fill="#666666" text-anchor="end">13 Aug</text>
<circle cx="52.0" cy="807.0" r="4.5" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="74.0" y="812.0" font-size="17" font-weight="500" fill="#111111" text-anchor="start">Shrink the job for a small open model</text>
<text x="860.0" y="812.0" font-size="15" font-weight="400" fill="#666666" text-anchor="end">21 Aug</text>
<circle cx="52.0" cy="843.0" r="4.5" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="74.0" y="848.0" font-size="17" font-weight="500" fill="#111111" text-anchor="start">Codex builds, Claude proves</text>
<text x="860.0" y="848.0" font-size="15" font-weight="400" fill="#666666" text-anchor="end">27 Sep</text>
<circle cx="52.0" cy="879.0" r="4.5" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="74.0" y="884.0" font-size="17" font-weight="500" fill="#111111" text-anchor="start">A diary, three strikes, thin slice</text>
<text x="860.0" y="884.0" font-size="15" font-weight="400" fill="#666666" text-anchor="end">30 Sep</text>
<circle cx="52.0" cy="915.0" r="4.5" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="74.0" y="920.0" font-size="17" font-weight="500" fill="#111111" text-anchor="start">A written, priced ladder of workers</text>
<text x="860.0" y="920.0" font-size="15" font-weight="400" fill="#666666" text-anchor="end">1 Oct</text>
<text x="40.0" y="978.0" font-size="21" font-weight="700" fill="#111111" text-anchor="start">Owner in control</text>
<text x="860.0" y="978.0" font-size="18" font-weight="600" fill="#9A9A9A" text-anchor="end">4</text>
<line x1="40.0" y1="990.0" x2="860.0" y2="990.0" stroke="#D6D6D6" stroke-width="1"/>
<circle cx="52.0" cy="1017.0" r="4.5" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="74.0" y="1022.0" font-size="17" font-weight="500" fill="#111111" text-anchor="start">A rulebook that changes only on his words</text>
<text x="860.0" y="1022.0" font-size="15" font-weight="400" fill="#666666" text-anchor="end">3 Jul / 23 Sep</text>
<circle cx="52.0" cy="1053.0" r="4.5" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="74.0" y="1058.0" font-size="17" font-weight="500" fill="#111111" text-anchor="start">Dictated idea to checked result in hours</text>
<text x="860.0" y="1058.0" font-size="15" font-weight="400" fill="#666666" text-anchor="end">3 Jul</text>
<circle cx="52.0" cy="1089.0" r="4.5" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="74.0" y="1094.0" font-size="17" font-weight="500" fill="#111111" text-anchor="start">A control panel for a non-coder</text>
<text x="860.0" y="1094.0" font-size="15" font-weight="400" fill="#666666" text-anchor="end">3 Sep</text>
<circle cx="52.0" cy="1125.0" r="4.5" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="74.0" y="1130.0" font-size="17" font-weight="500" fill="#111111" text-anchor="start">Keep truth, let derived be rebuilt</text>
<text x="860.0" y="1130.0" font-size="15" font-weight="400" fill="#666666" text-anchor="end">4 Oct</text>
<text x="40.0" y="1188.0" font-size="21" font-weight="700" fill="#111111" text-anchor="start">Measure, cost and honesty</text>
<text x="860.0" y="1188.0" font-size="18" font-weight="600" fill="#9A9A9A" text-anchor="end">4</text>
<line x1="40.0" y1="1200.0" x2="860.0" y2="1200.0" stroke="#D6D6D6" stroke-width="1"/>
<circle cx="52.0" cy="1227.0" r="4.5" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="74.0" y="1232.0" font-size="17" font-weight="500" fill="#111111" text-anchor="start">Numbers beside baselines, failures beside wins</text>
<text x="860.0" y="1232.0" font-size="15" font-weight="400" fill="#666666" text-anchor="end">26 Jun</text>
<circle cx="52.0" cy="1263.0" r="4.5" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="74.0" y="1268.0" font-size="17" font-weight="500" fill="#111111" text-anchor="start">Spend as code: reserve, then stop</text>
<text x="860.0" y="1268.0" font-size="15" font-weight="400" fill="#666666" text-anchor="end">24 Jul / 11 Sep</text>
<circle cx="52.0" cy="1299.0" r="4.5" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="74.0" y="1304.0" font-size="17" font-weight="500" fill="#111111" text-anchor="start">Test before adding, delete what fails</text>
<text x="860.0" y="1304.0" font-size="15" font-weight="400" fill="#666666" text-anchor="end">7 Aug</text>
<circle cx="52.0" cy="1335.0" r="4.5" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="74.0" y="1340.0" font-size="17" font-weight="500" fill="#111111" text-anchor="start">Measure the context policy, cut the rest</text>
<text x="860.0" y="1340.0" font-size="15" font-weight="400" fill="#666666" text-anchor="end">18 Sep</text>
<text x="40.0" y="1416.0" font-size="15" font-weight="400" fill="#666666" text-anchor="start">idea was checked against its sources in a private audit.</text>
<text x="40.0" y="1395.0" font-size="15" font-weight="400" fill="#666666" text-anchor="start">Dates: first seen in git history, logs or notes. Where the idea and its code differ, the date reads idea / code. Each</text>
<text x="40.0" y="1442.0" font-size="15" font-weight="500" fill="#9A9A9A" text-anchor="start">Samuel Pavlovič  ·  AI agentic work audit  ·  data to 9 Oct 2026</text>
</svg>
