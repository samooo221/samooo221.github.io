<text x="52.0" y="896.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="78.0" y="896.0" font-size="17" font-weight="700" fill="#EDEDED" text-anchor="start">3 Jul</text>
<text x="160.0" y="896.0" font-size="17" font-weight="400" fill="#EDEDED" text-anchor="start">First rule: a costly model plans, cheaper agents build.</text>
<circle cx="52.0" cy="927.0" r="12" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="52.0" y="932.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="78.0" y="932.0" font-size="17" font-weight="700" fill="#EDEDED" text-anchor="start">7 Aug</text>
<text x="160.0" y="932.0" font-size="17" font-weight="400" fill="#EDEDED" text-anchor="start">In my first fleet: never two model families in one role.</text>
<circle cx="52.0" cy="963.0" r="12" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="52.0" y="968.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="78.0" y="968.0" font-size="17" font-weight="700" fill="#EDEDED" text-anchor="start">25 Aug</text>
<text x="160.0" y="968.0" font-size="17" font-weight="400" fill="#EDEDED" text-anchor="start">I measure my own grader and correct my first claim.</text>
<circle cx="52.0" cy="999.0" r="12" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="52.0" y="1004.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="78.0" y="1004.0" font-size="17" font-weight="700" fill="#EDEDED" text-anchor="start">9 Sep</text>
<text x="160.0" y="1004.0" font-size="17" font-weight="400" fill="#EDEDED" text-anchor="start">Work below the lead, fenced by a balance floor and a file fence.</text>
<circle cx="52.0" cy="1035.0" r="12" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="52.0" y="1040.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="78.0" y="1040.0" font-size="17" font-weight="700" fill="#EDEDED" text-anchor="start">23 Sep</text>
<text x="160.0" y="1040.0" font-size="17" font-weight="400" fill="#EDEDED" text-anchor="start">Biggest day: a 331-agent run. A failed night becomes a kit.</text>
<circle cx="52.0" cy="1071.0" r="12" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="52.0" y="1076.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
<text x="78.0" y="1076.0" font-size="17" font-weight="700" fill="#EDEDED" text-anchor="start">1–2 Oct</text>
<text x="160.0" y="1076.0" font-size="17" font-weight="400" fill="#EDEDED" text-anchor="start">Six-level worker ladder. Seven mods: three guards, four panes and helpers.</text>
<circle cx="52.0" cy="1107.0" r="12" fill="#E5262B" stroke="none" stroke-width="1.4"/>
<text x="52.0" y="1112.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
<text x="78.0" y="1112.0" font-size="17" font-weight="700" fill="#EDEDED" text-anchor="start">8 Oct</text>
<text x="160.0" y="1112.0" font-size="17" font-weight="400" fill="#EDEDED" text-anchor="start">I measure my own tools. A 96-agent read-only review.</text>
<text x="40.0" y="1172.0" font-size="20" font-weight="700" fill="#EDEDED" text-anchor="start">Phases</text>
<text x="40.0" y="1204.0" font-size="17" font-weight="400" fill="#EDEDED" text-anchor="start">P1  One agent</text>
<text x="460.0" y="1204.0" font-size="17" font-weight="400" fill="#EDEDED" text-anchor="start">P2  Hand-run fleet</text>
<text x="40.0" y="1234.0" font-size="17" font-weight="400" fill="#EDEDED" text-anchor="start">P3  Cheap workers</text>
<text x="460.0" y="1234.0" font-size="17" font-weight="400" fill="#EDEDED" text-anchor="start">P4  Lead and councils</text>
<text x="40.0" y="1264.0" font-size="17" font-weight="400" fill="#EDEDED" text-anchor="start">P5  Write it down</text>
<text x="460.0" y="1264.0" font-size="17" font-weight="400" fill="#EDEDED" text-anchor="start">P6  Ladder and guards</text>
<text x="40.0" y="1294.0" font-size="17" font-weight="400" fill="#EDEDED" text-anchor="start">P7  Prune and measure</text>
<text x="40.0" y="1385.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="start">volume, not quality.</text>
<text x="40.0" y="1364.0" font-size="15" font-weight="400" fill="#B0B0B0" text-anchor="start">Prompts: the higher of the history file and the transcripts, so a floor. The last week is a part week. Bars show</text>
<text x="40.0" y="1411.0" font-size="15" font-weight="500" fill="#8C8C8C" text-anchor="start">Samuel Pavlovič  ·  AI agentic work audit  ·  data to 9 Oct 2026</text>
