<text x="78.0" y="860.0" font-size="17" font-weight="700" fill="#EDEDED" text-anchor="start">25 Jun</text>
<text x="160.0" y="860.0" font-size="17" font-weight="400" fill="#EDEDED" text-anchor="start">First prompt on record. One agent, one project.</text>
